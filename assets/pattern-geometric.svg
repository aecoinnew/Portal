      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#0B3D91" stroke-width="0.5" opacity="0.18"></path>
    </pattern>
  </defs>
  <rect width="800" height="400" fill="#FBFCFD"></rect>
  <rect width="800" height="400" fill="url(#grid)"></rect>
  <g opacity="0.18" stroke="#0B3D91" fill="none" stroke-width="1">
    <circle cx="400" cy="200" r="60"></circle>
    <circle cx="400" cy="200" r="120"></circle>
    <circle cx="400" cy="200" r="180"></circle>
  </g>
  <g opacity="0.45">
    <circle cx="400" cy="200" r="6" fill="#B0944D"></circle>
  </g>
</svg>